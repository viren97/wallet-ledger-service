{{- if .Values.externalSecret.enabled }}
# Synced by the External Secrets Operator from Vault / AWS Secrets Manager into a Kubernetes Secret.
# Rotating a value in the secret manager updates the Secret within refreshInterval; pods pick it up on restart.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "tms.fullname" . }}-secrets
  labels:
    {{- include "tms.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "tms.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .envVar }}
      remoteRef:
        key: {{ .remoteKey }}
        property: {{ .property }}
    {{- end }}
{{- end }}
